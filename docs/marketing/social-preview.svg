<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- GitHub social preview. The image on the right is media/demo-poster.png, a real capture from a nested
       GNOME Shell 51, cropped and scaled only. No extension name in the text, so it survives a rename.
       Render instructions: docs/marketing/github-metadata.md. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b26"/>
      <stop offset="1" stop-color="#2d2a4a"/>
    </linearGradient>
    <clipPath id="shot-clip">
      <rect x="664" y="96" width="576" height="448" rx="24"/>
    </clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <g font-family="Adwaita Sans, Cantarell, Inter, sans-serif" fill="#ffffff">
    <text x="64" y="112" font-size="26" font-weight="700" letter-spacing="2.5" fill="#c9b3ff">GNOME SHELL EXTENSION</text>
    <text x="64" y="212" font-size="76" font-weight="800">Window edges</text>
    <text x="64" y="300" font-size="76" font-weight="800">that snap</text>
    <text x="64" y="388" font-size="76" font-weight="800">together.</text>

    <text x="64" y="468" font-size="34" fill="#e4e1f0">Drag near another window: it lands</text>
    <text x="64" y="512" font-size="34" fill="#e4e1f0">flush, with a spring. Pull to let go.</text>

    <text x="64" y="592" font-size="28" fill="#a8a5b8">GNOME 51 · MIT · free software</text>
  </g>

  <!-- Crop of the poster around the three windows (poster is 1280x720). -->
  <g clip-path="url(#shot-clip)">
    <svg x="664" y="96" width="576" height="448" viewBox="330 40 900 700" preserveAspectRatio="xMidYMid slice">
      <image width="1280" height="720" xlink:href="../../media/demo-poster.png"/>
    </svg>
  </g>
  <rect x="664" y="96" width="576" height="448" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
